name: Go Vulnerability Check

on:
  push:
    branches:
      - ai-vulncheck-hackaton-poc

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install Python dependencies
        run: pip install -r scripts/vuln_analyzer/requirements.txt

      - name: Run govulncheck with JSON output
        run: |
          govulncheck -json ./... > govulncheck_results.json
        continue-on-error: true

      - name: Analyze vulnerabilities
        run: python3 scripts/vuln_analyzer/vuln_analyzer.py govulncheck_results.json --chunk-size 10 --output-file vuln_analysis.txt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Send to Slack
        if: always()
        run: |
          content=$(cat vuln_analysis.txt)
          curl -X POST \
          -H 'Content-type: application/json' \
          -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
          --data "{\"channel\": \"${{ secrets.SLACK_CHANNEL_ID }}\", \"text\": \"$content\"}" \
          https://slack.com/api/chat.postMessage
